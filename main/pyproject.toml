[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swing-trade-bot"
version = "1.3.0"
description = "A paper-only research and reporting package."
requires-python = ">=3.10"
dependencies = [
  "yfinance>=0.2.40",
  "scipy>=1.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
